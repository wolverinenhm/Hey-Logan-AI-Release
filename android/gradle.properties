# Gradle settings for the Hey Logan AI Android companion app.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# NOTE: the shipping APK for this release was built with the raw SDK tools
# (tools/build-apk-manual.ps1) because Gradle cannot initialise its native
# services on the build machine. See README.md / BUILD-NOTES.md.
